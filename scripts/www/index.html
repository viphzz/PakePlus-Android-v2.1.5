<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>四季扫雷 | Elemental Seasons</title>
    <!-- 引入彩带库 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- 引入图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* 基础变量 */
            --cell-size: 38px; /* 这个值现在会被JS动态修改 */
            --gap: 5px;        /* 间隙稍微调小一点以适应更多屏幕 */
            --radius: 6px;

            /* 默认春季配色 */
            --bg-color: #e0e5ec;
            --cell-bg: #e0e5ec;
            --cell-hover-bg: #f0f3f7; /* 新增悬停颜色 */
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --primary: #4b7bec;
            --accent: #20bf6b;
            --danger: #eb3b5a;
            --text-main: #4b6584;
            --coin-color: #f1c40f;
        }

        /* 主题配色 */
        body.theme-summer {
            --bg-color: #d1efe4; --cell-bg: #bde0d4; --cell-hover-bg: #d1efe4;
            --shadow-light: #e8fff5; --shadow-dark: #9bbab0; --primary: #fa8231; 
            --accent: #0fb9b1; --danger: #eb3b5a; --text-main: #34635f; --radius: 50%; 
        }
        body.theme-autumn {
            --bg-color: #f3e9d8; --cell-bg: #e6dcc9; --cell-hover-bg: #f3e9d8;
            --shadow-light: #fffaf0; --shadow-dark: #c2b8a6; --primary: #d35400; 
            --accent: #c0392b; --danger: #c44569; --text-main: #7f6e5d; --radius: 12px;
        }
        body.theme-winter {
            --bg-color: #dff9fb; --cell-bg: #c7ecee; --cell-hover-bg: #dff9fb;
            --shadow-light: #f7ffff; --shadow-dark: #9cbabe; --primary: #686de0; 
            --accent: #badc58; --danger: #ff7979; --text-main: #2c3e50; --radius: 4px;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Nunito', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        #particle-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        .ui-layer {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100vh; /* 占满屏幕高度 */
            padding-top: 10px;
        }

        /* --- 顶部面板 --- */
        .header {
            display: flex;
            gap: 8px;
            margin-bottom: 5px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            flex-shrink: 0; /* 防止被压缩 */
        }

        .card {
            background: var(--cell-bg);
            padding: 6px 12px;
            border-radius: 15px;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            display: flex; align-items: center; gap: 6px;
            font-weight: 700; font-size: 0.9rem; color: var(--text-main);
            transition: all 0.3s ease;
        }

        .zoom-controls { display: flex; gap: 5px; }
        .zoom-btn, .season-btn, .audio-btn {
            width: 36px; height: 36px;
            border-radius: 50%; border: none; background: var(--cell-bg);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            cursor: pointer; color: var(--text-main); font-weight: bold; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .zoom-btn:active, .season-btn:active, .audio-btn:active { 
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light); 
        }
        .audio-btn.off { opacity: 0.6; filter: grayscale(1); }

        /* --- 商店/道具栏 --- */
        .inventory {
            display: flex;
            gap: 12px;
            margin: 5px 0 10px 0;
            padding: 0 10px;
            justify-content: center;
            flex-shrink: 0; /* 防止被压缩 */
        }

        .item-slot {
            width: 60px; height: 70px;
            border-radius: 12px;
            background: var(--cell-bg);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; cursor: pointer;
            transition: all 0.2s ease; border: 2px solid transparent;
        }

        .item-slot.active { border-color: var(--primary); background: rgba(255, 255, 255, 0.3); }

        .item-icon { font-size: 20px; margin-bottom: 2px; }
        
        /* 修复：将数量移到左上角，避免与右上角的购买按钮重叠 */
        .item-count { 
            position: absolute; top: 2px; left: 4px; /* 改为 left */
            font-size: 10px; font-weight: bold; 
            background: var(--text-main); color: var(--bg-color);
            padding: 1px 4px; border-radius: 4px;
            z-index: 2;
        }

        .item-price {
            font-size: 9px; color: var(--text-main); margin-top: 4px;
            display: flex; align-items: center; gap: 2px;
        }
        .item-price i { color: var(--coin-color); font-size: 8px; }

        /* 购买按钮 (+) - 保持在右上角 */
        .buy-plus {
            position: absolute; top: -6px; right: -6px;
            width: 20px; height: 20px;
            background: var(--accent); color: white;
            border-radius: 50%; font-size: 14px; line-height: 20px;
            font-weight: bold; text-align: center;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            z-index: 5; cursor: pointer;
        }
        .buy-plus:active { transform: scale(0.9); }

        /* --- 游戏区域 --- */
        #game-board-container {
            flex: 1; /* 占据剩余空间 */
            width: 100%;
            overflow: auto; /* 允许滚动 */
            display: flex;
            /* 修改：移除 justify-content: center 以修复移动端大棋盘被裁切的问题 */
            /* 改用 margin: auto 在子元素上实现居中 */
            padding: 10px;
            /* 保证最小高度，防止界面完全塌缩 */
            min-height: 0; 
            -webkit-overflow-scrolling: touch; /* 优化iOS滚动体验 */
        }

        #game-board {
            padding: 10px;
            border-radius: 16px;
            background: var(--cell-bg);
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            display: grid;
            gap: var(--gap);
            margin: auto; /* 关键：当内容小于容器时居中，大于容器时对齐左上角，保证可滚动 */
            /* 关键：防止网格被强制压缩 */
            flex-shrink: 0; 
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border-radius: var(--radius);
            background: var(--cell-bg);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            font-size: calc(var(--cell-size) * 0.55);
            font-weight: 800;
            transition: all 0.2s ease; /* 平滑过渡 */
            position: relative;
        }
        
        body.theme-summer .cell { border-bottom-right-radius: 4px; } 

        /* 修复1：明显的鼠标悬停反馈 */
        .cell:hover:not(.revealed):not(.flagged) {
            transform: scale(0.95) translateY(-2px); /* 微微缩小并上浮 */
            filter: brightness(1.1); /* 变亮 */
            background-color: var(--cell-hover-bg); /* 切换背景色 */
            z-index: 2; /* 浮于上层 */
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
        }

        .cell.pressing {
            transform: scale(0.85);
            animation: shake-tiny 0.2s infinite;
        }

        .cell.revealed {
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
            cursor: default;
            background: rgba(255, 255, 255, 0.15);
            transform: none; /* 移除悬停效果 */
        }

        .c-1 { color: #3498db; } .c-2 { color: #2ecc71; } .c-3 { color: #e74c3c; }
        .c-4 { color: #9b59b6; } .c-5 { color: #f1c40f; } .c-6 { color: #1abc9c; }
        .c-7 { color: #34495e; } .c-8 { color: #7f8c8d; }

        .cell.flagged { color: var(--danger); }
        .cell.mine { background: var(--danger); color: white; }
        
        .controls {
            margin: 5px 0 15px 0;
            display: flex; gap: 8px;
            background: var(--cell-bg);
            padding: 5px;
            border-radius: 50px;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            flex-shrink: 0;
        }

        .btn {
            border: none; background: transparent; padding: 8px 20px;
            border-radius: 25px; font-weight: bold; color: var(--text-main);
            opacity: 0.7; cursor: pointer; transition: 0.3s;
        }
        .btn.active { background: var(--primary); color: white; opacity: 1; box-shadow: 0 4px 10px rgba(0,0,0, 0.2); }

        /* 动画 */
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        @keyframes shake-tiny { 0%, 100% { transform: scale(0.85) rotate(0deg); } 25% { transform: scale(0.85) rotate(2deg); } 75% { transform: scale(0.85) rotate(-2deg); } }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-30px); } }

        .anim-pop { animation: popIn 0.3s ease forwards; }
        .shake-board { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        .float-text {
            position: absolute; pointer-events: none; font-weight: bold; font-size: 16px;
            animation: floatUp 1s ease forwards; z-index: 100; text-shadow: 1px 1px 0 #fff;
        }

        /* 模态框 */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(8px);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200;
        }
        .modal-content {
            background: var(--bg-color); padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; border: 2px solid var(--primary);
        }
        .modal h2 { font-size: 1.8rem; margin: 0 0 10px 0; color: var(--text-main); }
        .modal p { font-size: 1.1rem; margin-bottom: 25px; color: var(--text-main); }
        .modal-btn {
            padding: 10px 35px; font-size: 1rem; background: var(--primary); color: white;
            border: none; border-radius: 50px; box-shadow: 0 5px 15px rgba(0,0,0, 0.2);
            cursor: pointer; transition: transform 0.2s; margin: 5px;
        }
        .modal-btn.secondary { background: var(--text-main); }
        .modal-btn:hover { transform: scale(1.05); }

    </style>
</head>
<body class="theme-spring">

    <canvas id="particle-canvas"></canvas>
    <audio id="bgm-player" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lo-fi-chill-medium-version-12798.mp3" type="audio/mpeg">
    </audio>

    <div class="ui-layer">
        <div class="header">
            <button class="season-btn" onclick="toggleSeason()" title="切换季节">🌸</button>
            <button class="audio-btn off" id="audio-btn" onclick="toggleBGM()" title="音乐开关">🎵</button>
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="adjustZoom(-2)" title="缩小">－</button>
                <button class="zoom-btn" onclick="adjustZoom(2)" title="放大">＋</button>
            </div>
            <div class="card"><span id="icon-flag">🚩</span> <span id="flag-cnt">10</span></div>
            <div class="card"><i class="fas fa-stopwatch" style="color: var(--primary)"></i> <span id="timer">000</span></div>
            <div class="card" style="color: var(--coin-color); min-width: 70px;">
                <i class="fas fa-coins"></i> <span id="coin-cnt">100</span>
            </div>
        </div>

        <div class="inventory">
            <div class="item-slot" id="slot-shield" onclick="buyItem('shield')">
                <span class="item-icon">🛡️</span>
                <span class="item-count" id="count-shield">0</span>
                <span class="item-price"><i class="fas fa-coins"></i> 50</span>
            </div>
            <div class="item-slot" id="slot-scanner" onclick="activateScanner()">
                <div class="buy-plus" onclick="buyItem('scanner'); event.stopPropagation();">＋</div>
                <span class="item-icon">📡</span>
                <span class="item-count" id="count-scanner">0</span>
                <span class="item-price"><i class="fas fa-coins"></i> 50</span>
            </div>
            <div class="item-slot" id="slot-totem" onclick="buyItem('totem')">
                <span class="item-icon">⚰️</span>
                <span class="item-count" id="count-totem">0</span>
                <span class="item-price"><i class="fas fa-coins"></i> 150</span>
            </div>
        </div>

        <div id="game-board-container">
            <div id="game-board"></div>
        </div>

        <div class="controls">
            <button class="btn active" onclick="setDifficulty('easy')">简单</button>
            <button class="btn" onclick="setDifficulty('medium')">中等</button>
            <button class="btn" onclick="setDifficulty('hard')">困难</button>
        </div>
    </div>

    <!-- 模态框省略重复结构... -->
    <div class="modal" id="game-modal">
        <div class="modal-content">
            <h2 id="modal-title">胜利!</h2>
            <p id="modal-desc">用时: 120秒</p>
            <button class="modal-btn" onclick="initGame()">再玩一次</button>
        </div>
    </div>
    <div class="modal" id="revive-modal">
        <div class="modal-content">
            <h2 style="color: var(--coin-color)">⚠ 危险!</h2>
            <p>你踩到了地雷！<br>是否消耗 1 个复活图腾继续游戏？<br><span style="font-size:0.9em; color:#e74c3c">(复活将清空所有金币)</span></p>
            <div style="display:flex; justify-content:center;">
                <button class="modal-btn" onclick="confirmRevive(true)">是 (消耗图腾)</button>
                <button class="modal-btn secondary" onclick="confirmRevive(false)">否 (结束游戏)</button>
            </div>
        </div>
    </div>

    <script>
        // 音频系统保持不变
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        const SFX = {
            click: () => playTone(800, 'sine', 0.05),
            flag: () => playTone(300, 'square', 0.1),
            buy: () => { playTone(1200, 'sine', 0.1); setTimeout(() => playTone(1600, 'sine', 0.1), 100); },
            error: () => playTone(150, 'sawtooth', 0.2),
            reveal: () => playTone(600, 'triangle', 0.05),
            win: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.2), i * 150)); },
            explode: () => playNoise(0.5)
        };
        function playTone(freq, type, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        function playNoise(duration) {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * duration; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer; const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            noise.connect(gain); gain.connect(audioCtx.destination); noise.start();
        }
        let bgmPlaying = false;
        function toggleBGM() {
            initAudio(); const bgm = document.getElementById('bgm-player'); const btn = document.getElementById('audio-btn');
            bgm.volume = 0.3;
            if (bgmPlaying) { bgm.pause(); btn.classList.add('off'); } else { bgm.play().catch(e => console.log("需用户交互")); btn.classList.remove('off'); }
            bgmPlaying = !bgmPlaying;
        }

        // 游戏逻辑
        const THEMES = ['spring', 'summer', 'autumn', 'winter'];
        const THEME_CONFIG = {
            spring: { icon: '🌸', flag: '🚩', mine: '💣', particles: { type: 'none', color: '#ff7675' } },
            summer: { icon: '🪷', flag: '🪷', mine: '🐸', particles: { type: 'rain', color: '#74b9ff' } },
            autumn: { icon: '🍂', flag: '🍁', mine: '🕷️', particles: { type: 'leaves', color: '#d35400' } },
            winter: { icon: '❄️', flag: '🎄', mine: '☃️', particles: { type: 'snow', color: '#ffffff' } }
        };

        const CONFIG = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 }
        };

        const ITEM_PRICES = { shield: 50, scanner: 50, totem: 150 };

        let state = {
            mode: 'easy', themeIdx: 0, grid: [], gameOver: false, timer: 0, timerId: null,
            flags: 0, minesLeft: 0, revealed: 0, coins: 100, firstClick: true,
            inventory: { shield: 0, scanner: 0, totem: 0 }, totemBought: false, activeItem: null, pendingMineHit: null
        };

        const boardEl = document.getElementById('game-board');

        // 修复3：自适应缩放计算函数 - 移动端优化
        function autoResizeBoard() {
            const cfg = CONFIG[state.mode];
            const headerH = 160; // 顶部预留高度
            const footerH = 60;  // 底部预留高度
            const padding = 20;  // 左右内边距
            
            const availW = window.innerWidth - padding;
            const availH = window.innerHeight - headerH - footerH;

            // 计算格子大小：可用空间 / 格子数量 (减去间隙)
            const maxW = (availW - (cfg.cols * 6)) / cfg.cols;
            const maxH = (availH - (cfg.rows * 6)) / cfg.rows;

            // 取宽高中较小的一个作为基准
            let newSize = Math.floor(Math.min(maxW, maxH));
            
            // 移动端优化：设置最小触摸尺寸
            // 如果计算出的尺寸小于24px（手机上太小无法点击），则强制设为24px
            // 这会导致容器溢出，但用户可以通过滚动来查看全部内容，而不是看着看不清的微小格子
            const minTouchSize = 24; 
            if (window.innerWidth < 768 && newSize < minTouchSize) {
                newSize = minTouchSize;
            }

            if (newSize < 12) newSize = 12; // 极端情况下的绝对最小值
            if (newSize > 45) newSize = 45; // 最大尺寸限制

            document.documentElement.style.setProperty('--cell-size', `${newSize}px`);
        }

        // 监听窗口大小变化
        window.addEventListener('resize', () => {
            autoResizeBoard();
            resizeCanvas();
        });

        // 手动缩放（基于当前大小微调）
        function adjustZoom(delta) {
            const currentSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell-size'));
            let newSize = currentSize + delta;
            if (newSize < 10) newSize = 10;
            if (newSize > 60) newSize = 60;
            document.documentElement.style.setProperty('--cell-size', `${newSize}px`);
        }

        function toggleSeason() { state.themeIdx = (state.themeIdx + 1) % THEMES.length; applyTheme(); }

        function applyTheme() {
            const themeName = THEMES[state.themeIdx];
            const themeData = THEME_CONFIG[themeName];
            document.body.className = `theme-${themeName}`;
            document.querySelector('.season-btn').textContent = themeData.icon;
            document.getElementById('icon-flag').textContent = themeData.flag;
            state.grid.flat().forEach(cell => {
                if (cell.flagged && !cell.revealed) cell.el.textContent = themeData.flag;
                if (cell.revealed && cell.isMine) cell.el.textContent = themeData.mine;
            });
            initParticles(themeData.particles);
        }

        // 粒子系统
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [], animationId;
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        function initParticles(config) {
            cancelAnimationFrame(animationId); particles = []; resizeCanvas();
            if (config.type === 'none') { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
            for (let i = 0; i < 50; i++) particles.push(createParticle(config));
            animateParticles(config);
        }
        function createParticle(config) {
            return {
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                size: Math.random() * 5 + 2, speedY: Math.random() * 1 + 0.5, speedX: Math.random() * 1 - 0.5,
                opacity: Math.random() * 0.5 + 0.1, color: config.color, type: config.type
            };
        }
        function animateParticles(config) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y += p.speedY; p.x += p.speedX;
                if (p.y > canvas.height) p.y = -10;
                if (p.x > canvas.width) p.x = 0; if (p.x < 0) p.x = canvas.width;
                ctx.beginPath(); ctx.globalAlpha = p.opacity; ctx.fillStyle = p.color;
                if (config.type === 'snow') { ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
                else if (config.type === 'leaves') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.x * 0.05); ctx.fillRect(0, 0, p.size, p.size * 1.5); ctx.restore(); }
                else if (config.type === 'rain') { ctx.fillRect(p.x, p.y, 1, p.size * 2); }
            });
            ctx.globalAlpha = 1; animationId = requestAnimationFrame(() => animateParticles(config));
        }

        function setDifficulty(mode) {
            state.mode = mode;
            document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            initGame();
        }

        function initGame() {
            initAudio();
            clearInterval(state.timerId);
            state.gameOver = false;
            state.timer = 0;
            state.firstClick = true;
            state.grid = [];
            state.revealed = 0;
            state.activeItem = null;
            state.totemBought = false;
            state.coins = 100;
            
            document.getElementById('timer').textContent = '000';
            document.getElementById('game-modal').style.display = 'none';
            document.getElementById('revive-modal').style.display = 'none';
            boardEl.className = ''; 
            updateInventoryUI();
            updateCoinUI();
            
            // 每次开始游戏前，先自动适配一次屏幕
            autoResizeBoard();

            const cfg = CONFIG[state.mode];
            state.minesLeft = cfg.mines;
            state.flags = cfg.mines;
            document.getElementById('flag-cnt').textContent = state.flags;

            boardEl.style.gridTemplateColumns = `repeat(${cfg.cols}, var(--cell-size))`;
            boardEl.innerHTML = '';

            for (let r = 0; r < cfg.rows; r++) {
                let row = [];
                for (let c = 0; c < cfg.cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r; cell.dataset.c = c;
                    
                    cell.addEventListener('mousedown', (e) => {
                        if (e.button === 0) handleLeftClick(r, c);
                        if (e.button === 2) handleRightClick(r, c);
                    });
                    
                    let pressTimer;
                    cell.addEventListener('touchstart', (e) => {
                        if(state.gameOver || state.grid[r][c].revealed) return;
                        cell.classList.add('pressing');
                        pressTimer = setTimeout(() => {
                            handleRightClick(r, c);
                            if(navigator.vibrate) navigator.vibrate(50);
                            cell.classList.remove('pressing');
                        }, 500);
                    });
                    cell.addEventListener('touchend', () => { clearTimeout(pressTimer); cell.classList.remove('pressing'); });
                    cell.addEventListener('touchmove', () => { clearTimeout(pressTimer); cell.classList.remove('pressing'); });
                    cell.addEventListener('contextmenu', e => e.preventDefault());

                    boardEl.appendChild(cell);
                    row.push({ el: cell, isMine: false, revealed: false, flagged: false, neighborMines: 0 });
                }
                state.grid.push(row);
            }
            applyTheme();
        }

        function placeMines(excludeR, excludeC) {
            const cfg = CONFIG[state.mode];
            let minesPlaced = 0;
            while (minesPlaced < cfg.mines) {
                let r = Math.floor(Math.random() * cfg.rows);
                let c = Math.floor(Math.random() * cfg.cols);
                if (Math.abs(r - excludeR) <= 1 && Math.abs(c - excludeC) <= 1) continue;
                if (!state.grid[r][c].isMine) {
                    state.grid[r][c].isMine = true;
                    minesPlaced++;
                }
            }
            for (let r = 0; r < cfg.rows; r++) {
                for (let c = 0; c < cfg.cols; c++) {
                    if (!state.grid[r][c].isMine) {
                        state.grid[r][c].neighborMines = countMines(r, c);
                    }
                }
            }
            startTimer();
        }

        function countMines(r, c) {
            let count = 0;
            const cfg = CONFIG[state.mode];
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    let nr = r + i, nc = c + j;
                    if (nr >= 0 && nr < cfg.rows && nc >= 0 && nc < cfg.cols) {
                        if (state.grid[nr][nc].isMine) count++;
                    }
                }
            }
            return count;
        }

        function startTimer() {
            state.timerId = setInterval(() => {
                state.timer++;
                document.getElementById('timer').textContent = state.timer.toString().padStart(3, '0');
            }, 1000);
        }

        function handleLeftClick(r, c) {
            if (state.gameOver) return;
            initAudio();
            const cell = state.grid[r][c];
            if (cell.flagged || cell.revealed) return;

            if (state.activeItem === 'scanner') { useScanner(r, c); return; }
            if (state.firstClick) { placeMines(r, c); state.firstClick = false; }

            if (cell.isMine) {
                if (state.inventory.shield > 0) { triggerShield(cell); return; }
                if (state.inventory.totem > 0) {
                    state.pendingMineHit = {r, c};
                    clearInterval(state.timerId);
                    SFX.error();
                    document.getElementById('revive-modal').style.display = 'flex';
                    return;
                }
                SFX.explode();
                triggerGameOver(false);
                return;
            }

            SFX.reveal();
            revealCell(r, c);
            checkWin();
        }

        function handleRightClick(r, c) {
            if (state.gameOver || state.grid[r][c].revealed) return;
            initAudio();
            const cell = state.grid[r][c];
            const themeFlag = THEME_CONFIG[THEMES[state.themeIdx]].flag;

            if (state.activeItem) { deactivateItems(); return; }

            cell.flagged = !cell.flagged;
            cell.el.classList.toggle('flagged');
            cell.el.textContent = cell.flagged ? themeFlag : '';
            state.flags += cell.flagged ? -1 : 1;
            document.getElementById('flag-cnt').textContent = state.flags;
            SFX.flag();
        }

        function revealCell(r, c) {
            const cfg = CONFIG[state.mode];
            if (r < 0 || r >= cfg.rows || c < 0 || c >= cfg.cols) return;
            const cell = state.grid[r][c];
            if (cell.revealed || cell.flagged) return;

            cell.revealed = true;
            state.revealed++;
            cell.el.classList.add('revealed', 'anim-pop');

            let coinGain = 1;
            if (state.mode === 'medium') coinGain = 2;
            if (state.mode === 'hard') coinGain = 3;
            state.coins += coinGain;
            updateCoinUI();
            if (Math.random() > 0.8) showFloatText(cell.el, `+${coinGain}`, 'var(--coin-color)');

            if (cell.neighborMines > 0) {
                cell.el.textContent = cell.neighborMines;
                cell.el.classList.add(`c-${cell.neighborMines}`);
            } else {
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        revealCell(r + i, c + j);
                    }
                }
            }
        }

        function updateCoinUI() { document.getElementById('coin-cnt').textContent = state.coins; updateInventoryUI(); }

        function updateInventoryUI() {
            ['shield', 'scanner', 'totem'].forEach(type => {
                const slot = document.getElementById(`slot-${type}`);
                const countEl = document.getElementById(`count-${type}`);
                const count = state.inventory[type];
                const price = ITEM_PRICES[type];
                
                countEl.textContent = count;
                slot.classList.remove('can-buy', 'cant-afford', 'active', 'sold-out');

                if (state.activeItem === type) slot.classList.add('active');
                if (state.coins < price) slot.classList.add('cant-afford');
                else slot.classList.add('can-buy');
            });
        }

        function buyItem(type) {
            initAudio();
            if (state.gameOver) return;
            const price = ITEM_PRICES[type];
            const slot = document.getElementById(`slot-${type}`);

            if (state.coins >= price) {
                state.coins -= price;
                state.inventory[type]++;
                state.totemBought = true;
                updateCoinUI();
                SFX.buy();
                showFloatText(slot, "购买成功!", "#20bf6b");
            } else {
                SFX.error();
                showFloatText(slot, "金币不足!", "#e74c3c");
                slot.classList.add('shake-board');
                setTimeout(() => slot.classList.remove('shake-board'), 500);
            }
        }

        function activateScanner() {
            initAudio();
            if (state.gameOver) return;
            const type = 'scanner';
            if (state.inventory[type] > 0) {
                if (state.activeItem === type) { deactivateItems(); } else { state.activeItem = type; updateInventoryUI(); boardEl.style.cursor = 'crosshair'; }
            } else { buyItem(type); }
        }

        function deactivateItems() { state.activeItem = null; updateInventoryUI(); boardEl.style.cursor = 'default'; }

        function triggerShield(cell) {
            state.inventory.shield--; updateInventoryUI();
            cell.isMine = false; cell.revealed = true;
            cell.el.classList.add('revealed'); cell.el.textContent = '🛡️'; 
            state.revealed++; state.minesLeft--; state.flags--; 
            document.getElementById('flag-cnt').textContent = state.flags;
            SFX.flag(); showFloatText(cell.el, "格挡!", "#20bf6b");
            boardEl.classList.add('shake-board'); setTimeout(() => boardEl.classList.remove('shake-board'), 500); checkWin();
        }

        function useScanner(r, c) {
            state.inventory.scanner--; deactivateItems(); updateInventoryUI();
            const cfg = CONFIG[state.mode]; showFloatText(state.grid[r][c].el, "扫描中...", "#4b7bec"); SFX.reveal();
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    let nr = r + i, nc = c + j;
                    if (nr >= 0 && nr < cfg.rows && nc >= 0 && nc < cfg.cols) {
                        const target = state.grid[nr][nc];
                        if (!target.revealed && !target.flagged) {
                            if (!target.isMine) { setTimeout(() => revealCell(nr, nc), 150); } else { target.el.style.backgroundColor = '#fab1a0'; setTimeout(() => target.el.style.backgroundColor = '', 800); }
                        }
                    }
                }
            }
        }

        function confirmRevive(shouldRevive) {
            document.getElementById('revive-modal').style.display = 'none';
            if (shouldRevive) {
                state.inventory.totem--; state.coins = 0; updateCoinUI(); updateInventoryUI();
                const {r, c} = state.pendingMineHit; const cell = state.grid[r][c];
                cell.isMine = false; cell.revealed = true; cell.el.classList.add('revealed'); cell.el.textContent = '✨'; 
                state.revealed++; state.minesLeft--; state.flags--; document.getElementById('flag-cnt').textContent = state.flags;
                SFX.buy(); showFloatText(cell.el, "复活成功!", "#e67e22"); startTimer(); checkWin();
            } else { SFX.explode(); triggerGameOver(false); }
        }

        function showFloatText(el, text, color) {
            const rect = el.getBoundingClientRect(); const x = rect.left + (rect.width/2) - 10; const y = rect.top;
            const floatEl = document.createElement('div'); floatEl.className = 'float-text'; floatEl.textContent = text;
            floatEl.style.color = color; floatEl.style.left = x + 'px'; floatEl.style.top = y + 'px';
            document.body.appendChild(floatEl); setTimeout(() => floatEl.remove(), 1000);
        }

        function checkWin() {
            let unrevealedSafe = 0; state.grid.flat().forEach(cell => { if (!cell.isMine && !cell.revealed) unrevealedSafe++; });
            if (unrevealedSafe === 0) triggerGameOver(true);
        }

        function triggerGameOver(win) {
            state.gameOver = true; clearInterval(state.timerId);
            const modal = document.getElementById('game-modal'); const title = document.getElementById('modal-title'); const desc = document.getElementById('modal-desc');
            const themeMine = THEME_CONFIG[THEMES[state.themeIdx]].mine;

            if (win) {
                SFX.win(); title.textContent = "🎉 完美通关!"; title.style.color = "var(--accent)";
                desc.innerHTML = `模式: ${state.mode.toUpperCase()}<br>用时: ${state.timer}秒<br>获得金币: +50`;
                state.coins += 50; updateCoinUI(); confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            } else {
                title.textContent = "💥 行动失败"; title.style.color = "var(--danger)"; desc.textContent = "再接再厉！(金币已重置)";
                state.grid.flat().forEach(cell => { if (cell.isMine) { cell.el.classList.add('mine'); cell.el.textContent = themeMine; } });
                boardEl.classList.add('shake-board');
            }
            setTimeout(() => { modal.style.display = 'flex'; }, 1000);
        }

        initGame();

    </script>
</body>
</html>
